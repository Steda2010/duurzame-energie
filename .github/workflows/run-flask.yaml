name: Run Flask App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-flask:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Start Flask app
        run: |
          export FLASK_APP=app.py
          export FLASK_ENV=development
          flask run --host=127.0.0.1 --port=5000 > flask.log 2>&1 &
          echo $! > flask.pid
          sleep 5

      - name: Verify Flask app responds
        run: curl --fail --silent --show-error http://127.0.0.1:5000

      - name: Show Flask logs on failure
        if: failure()
        run: |
          cat flask.log || true
          if [ -f flask.pid ]; then kill $(cat flask.pid) || true; fi
