name: Run Python Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-24.04  # Avoid ubuntu-latest migration issues

    steps:
      # Checkout latest code (pinned to latest commit SHA for Node.js 24 support)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      # Setup Python (pinned to latest commit SHA for Node.js 24 support)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Run your script
      - name: Run script
        run: python app.py
